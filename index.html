<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPHEREx Sky Explorer</title>
    <meta name="description" content="Explore NASA SPHEREx all-sky infrared images and detect sky changes over time through blinking, timelines, and side-by-side comparison." />
    <meta property="og:title" content="SPHEREx Sky Explorer" />
    <meta property="og:description" content="Explore NASA SPHEREx all-sky infrared images and detect sky changes over time through blinking, timelines, and side-by-side comparison." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('spherex-theme') || localStorage.getItem('theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
